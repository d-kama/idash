name: Setup toolchain & install
description: >-
  mise でツールチェーン（python/node/uv/pnpm/just）を導入し、frozen install で
  依存を解決する。uv / pnpm のキャッシュも復元する。check / deploy ジョブで共用。

runs:
  using: composite
  steps:
    # mise.toml を単一ソースに python/node/uv/pnpm/just を導入（ローカルと同一手順）
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

    # uv のダウンロードキャッシュ（uv.lock 変化で更新）
    - name: Cache uv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    # pnpm store のパスを解決（mise 導入の pnpm を使用）。
    # GITHUB_ENV ではなく step output で渡す: GITHUB_ENV は後続の全ステップの環境変数になり、
    # 値を操作されると LD_PRELOAD 等でコード実行に繋がるため（zizmor: github-env）。
    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # pnpm store のキャッシュ（pnpm-lock.yaml 変化で更新）
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    # frozen install（lockfile ドリフトを検知して落とす）
    - name: Install dependencies (frozen)
      shell: bash
      run: just setup-ci
