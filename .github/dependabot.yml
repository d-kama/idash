version: 2
updates:
  # GitHub Actions を SHA pin で固定しているため、Dependabot で陳腐化を防ぐ。
  # workflow（.github/workflows）と共用 composite（.github/actions/setup）の両方を対象。
  - package-ecosystem: github-actions
    directories:
      - "/" # .github/workflows/ 配下（checkout / configure-aws-credentials）
      - "/.github/actions/setup" # 共用 composite（mise-action / cache）
    schedule:
      interval: weekly
    # 公開から 7 日未満のリリースは PR にしない。乗っ取られたメンテナが正規タグで
    # 悪性リリースを出した場合、SHA 検証（zizmor）は素通りするため、発覚・撤回されるまでの
    # 猶予期間で防ぐ。侵害リリースは数時間〜数日で発覚することが多いので 7 日とする。
    cooldown:
      default-days: 7
    groups:
      # 更新 PR をまとめてノイズを抑える
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
